# .github/workflows/download-playlist.yml
name: 📥 YouTube Playlist Downloader (Per‑video folders + auto split)

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: '🔗 YouTube Playlist URL'
        required: true
        type: string
      quality:
        description: '🎬 Video quality'
        required: true
        type: choice
        options:
          - 'best (original)'
          - '2160p (4K)'
          - '1440p (2K)'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
      playlist_items:
        description: 'Item range (e.g., 1:4 , 1,3,5 , 5:10,15,20:25) – leave empty for full playlist'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp with EJS, aria2, ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: true
          ffmpeg: true

      - name: Install p7zip-full for splitting
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Create cookies file (if secret exists)
        env:
          COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
            echo "✅ Cookies loaded"
          fi

      - name: Determine yt-dlp format
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          case "$QUALITY" in
            "best (original)") FORMAT="bestvideo+bestaudio/best" ;;
            "2160p (4K)") FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]" ;;
            "1440p (2K)") FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]" ;;
            "1080p") FORMAT="bestvideo[height<=1080][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=1080]" ;;
            "720p") FORMAT="bestvideo[height<=720][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=720]" ;;
            "480p") FORMAT="bestvideo[height<=480][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=480]" ;;
            "360p") FORMAT="bestvideo[height<=360][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=360]" ;;
            *) FORMAT="bestvideo+bestaudio/best" ;;
          esac
          echo "FORMAT=$FORMAT" >> $GITHUB_ENV

      - name: Download playlist (each video into its own folder)
        id: download
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          PLAYLIST_TITLE=$(yt-dlp --get-filename -o '%(playlist_title)s' '${{ github.event.inputs.playlist_url }}' 2>/dev/null | sed 's/[^a-zA-Z0-9\u0600-\u06FF\-_]/_/g')
          [ -z "$PLAYLIST_TITLE" ] && PLAYLIST_TITLE="playlist"
          FINAL_NAME="${PLAYLIST_TITLE}_${TIMESTAMP}"
          mkdir -p "downloads/${FINAL_NAME}"

          CMD="yt-dlp -f '${{ env.FORMAT }}' \
            --merge-output-format mkv \
            --downloader aria2c \
            --downloader-args 'aria2c:-x 16 -s 16 -k 1M' \
            --write-subs \
            --write-auto-subs \
            --sub-langs "fa,en" \
            --sub-format "srt/best" \
            --embed-subs \
            --convert-subs srt \
            --embed-thumbnail \
            --add-metadata \
            --write-description \
            --write-info-json \
            --download-archive archive.txt \
            -o 'downloads/${FINAL_NAME}/%(playlist_index)s - %(title)s/%(title)s.%(ext)s' \
            '${{ github.event.inputs.playlist_url }}'"

          [ -n "${{ github.event.inputs.playlist_items }}" ] && CMD="$CMD --playlist-items '${{ github.event.inputs.playlist_items }}'"
          [ -f cookies.txt ] && CMD="$CMD --cookies cookies.txt"

          echo "🚀 Downloading playlist..."
          eval $CMD || echo "⚠️ Some videos failed, continuing..."
          echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV

      - name: Split large videos (>95MB) inside their own folders
        run: |
          PLAYLIST_DIR="downloads/${{ env.FINAL_NAME }}"
          find "$PLAYLIST_DIR" -mindepth 1 -maxdepth 1 -type d | while read folder; do
            mkv_file=$(find "$folder" -maxdepth 1 -name "*.mkv" | head -1)
            if [ -f "$mkv_file" ]; then
              size=$(stat -c%s "$mkv_file")
              if [ "$size" -gt $((95 * 1024 * 1024)) ]; then
                echo "📦 Splitting $(basename "$mkv_file") (size: $((size/1024/1024)) MB)"
                cd "$folder"
                7z a -v95m "video.7z" "$(basename "$mkv_file")"
                rm "$(basename "$mkv_file")"
                cd - > /dev/null
              else
                echo "✅ $(basename "$mkv_file") under 95MB, no split."
              fi
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "downloads/${{ env.FINAL_NAME }}"
          git add archive.txt
          git commit -m "🎬 Playlist: ${{ env.FINAL_NAME }}" || echo "No changes"
          git push
