# .github/workflows/download.yml
name: 🎬 YouTube Downloader - Professional Edition

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 YouTube video URL'
        required: true
        type: string
        default: 'https://youtu.be/dQw4w9WgXcQ'
      quality:
        description: '🎬 Select quality (Persian & English subs will be embedded)'
        required: true
        type: choice
        options:
          - 'best (original quality)'
          - '2160p (4K)'
          - '1440p (2K)'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp with EJS, aria2, ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: true
          ffmpeg: true

      - name: Create cookies file (if secret YOUTUBE_COOKIES exists)
        env:
          COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
            echo "✅ Cookies loaded"
          else
            echo "⚠️ No cookies – may encounter bot detection for some videos"
          fi

      - name: Determine yt-dlp format based on quality
        id: set_format
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          case "$QUALITY" in
            "best (original quality)")
              FORMAT="bestvideo+bestaudio/best"
              ;;
            "2160p (4K)")
              FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]"
              ;;
            "1440p (2K)")
              FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]"
              ;;
            "1080p")
              FORMAT="bestvideo[height<=1080][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=1080]"
              ;;
            "720p")
              FORMAT="bestvideo[height<=720][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=720]"
              ;;
            "480p")
              FORMAT="bestvideo[height<=480][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=480]"
              ;;
            "360p")
              FORMAT="bestvideo[height<=360][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=360]"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/best"
              ;;
          esac
          echo "FORMAT=$FORMAT" >> $GITHUB_ENV
          echo "✅ Format set: $FORMAT"

      - name: Download video with Persian & English subtitles (MKV)
        id: download
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SAFE_TITLE=$(yt-dlp --get-filename -o '%(title)s' '${{ github.event.inputs.video_url }}' 2>/dev/null | sed 's/[^a-zA-Z0-9\u0600-\u06FF\-_]/_/g')
          if [ -z "$SAFE_TITLE" ]; then
            SAFE_TITLE="video"
          fi
          FINAL_NAME="${SAFE_TITLE}_${TIMESTAMP}_${{ github.event.inputs.quality }}"
          mkdir -p "downloads/${FINAL_NAME}"
          
          DOWNLOAD_CMD="yt-dlp -f '${{ env.FORMAT }}' \
            --merge-output-format mkv \
            --downloader aria2c \
            --downloader-args 'aria2c:-x 16 -s 16 -k 1M' \
            --write-subs \
            --write-auto-subs \
            --sub-langs "fa,en" \
            --sub-format "srt/best" \
            --embed-subs \
            --convert-subs srt \
            --embed-thumbnail \
            --add-metadata \
            --write-description \
            --write-info-json \
            -o 'downloads/${FINAL_NAME}/[%(uploader)s] - %(title)s.%(ext)s' \
            '${{ github.event.inputs.video_url }}'"
          [ -f cookies.txt ] && DOWNLOAD_CMD="$DOWNLOAD_CMD --cookies cookies.txt"
          
          echo "🚀 Downloading with subtitle embedding..."
          eval $DOWNLOAD_CMD
          
          if [ ! -f "downloads/${FINAL_NAME}"/*.mkv ]; then
            echo "❌ Download failed – no MKV file created"
            exit 1
          fi
          
          echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV
          echo "✅ Download completed: downloads/${FINAL_NAME}/"

      - name: Split video if larger than 95MB (using 7z)
        run: |
          VIDEO_PATH=$(find "downloads/${{ env.FINAL_NAME }}" -maxdepth 1 -name "*.mkv" | head -1)
          if [ -f "$VIDEO_PATH" ]; then
            SIZE=$(stat -c%s "$VIDEO_PATH")
            if [ $SIZE -gt $((95 * 1024 * 1024)) ]; then
              echo "📦 Video size exceeds 95MB, splitting into 95MB parts with 7z..."
              cd "downloads/${{ env.FINAL_NAME }}"
              7z a -v95m "video.7z" "$(basename "$VIDEO_PATH")"
              rm "$(basename "$VIDEO_PATH")"
              cd ../..
              echo "✅ Split into parts: downloads/${{ env.FINAL_NAME }}/video.7z.001, etc."
            else
              echo "📄 Video size is under 95MB, no splitting needed."
            fi
          else
            echo "❌ Video file not found for splitting."
          fi

      - name: Commit and push to repository (only new files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "downloads/${{ env.FINAL_NAME }}"
          git commit -m "🎥 Add video & its metadata: ${{ env.FINAL_NAME }}" || echo "No new files to commit"
          git push
