# .github/workflows/download.yml
name: YouTube Premium Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک ویدیو یوتیوب (مثال: https://youtu.be/... یا https://www.youtube.com/watch?v=...)'
        required: true
        type: string
        default: 'https://youtu.be/dQw4w9WgXcQ'
      quality:
        description: '🎬 کیفیت مورد نظر'
        required: true
        type: choice
        options:
          - 'best (بالاترین کیفیت ممکن - ممکن است کدک AV1 باشد)'
          - '2160p (4K)'
          - '1440p (2K)'
          - '1080p (Full HD - ترجیحا H.264)'
          - '720p (HD)'
          - '480p'
          - '360p'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp with EJS, aria2 and ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true
          aria2: true
          ffmpeg: true

      - name: Create cookies file from secret (if exists)
        env:
          COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
            echo "✅ Cookies file created"
          else
            echo "⚠️ No cookies secret found. If you get a bot error, add YOUTUBE_COOKIES secret."
          fi

      - name: Set format based on quality
        id: set_format
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          case "$QUALITY" in
            "best (بالاترین کیفیت ممکن - ممکن است کدک AV1 باشد)")
              FORMAT="bestvideo+bestaudio/best"
              ;;
            "2160p (4K)")
              FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]"
              ;;
            "1440p (2K)")
              FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]"
              ;;
            "1080p (Full HD - ترجیحا H.264)")
              FORMAT="bestvideo[height<=1080][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]"
              ;;
            "720p (HD)")
              FORMAT="bestvideo[height<=720][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]"
              ;;
            "480p")
              FORMAT="bestvideo[height<=480][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]"
              ;;
            "360p")
              FORMAT="bestvideo[height<=360][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=360][ext=mp4]"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/best"
              ;;
          esac
          echo "FORMAT=$FORMAT" >> $GITHUB_ENV
          echo "✅ Format set: $FORMAT"

      - name: Download video from YouTube
        run: |
          mkdir -p downloads
          DOWNLOAD_CMD="yt-dlp -f '${{ env.FORMAT }}' \
            --merge-output-format mp4 \
            --downloader aria2c \
            --downloader-args 'aria2c:-x 16 -s 16 -k 1M' \
            -o 'downloads/%(title)s.%(ext)s' \
            '${{ github.event.inputs.video_url }}'"
          
          if [ -f cookies.txt ]; then
            DOWNLOAD_CMD="$DOWNLOAD_CMD --cookies cookies.txt"
            echo "✅ Using cookies"
          fi
          
          echo "Running: $DOWNLOAD_CMD"
          eval $DOWNLOAD_CMD
          
          if [ -z "$(ls -A downloads 2>/dev/null)" ]; then
            echo "❌ No files downloaded. Try a different quality or add cookies."
            exit 1
          fi
          echo "✅ Download completed"

      - name: Upload video to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: video-${{ github.run_number }}
          name: "🎥 Video ${{ github.run_number }}"
          body: |
            **Requested URL:** ${{ github.event.inputs.video_url }}
            **Quality:** ${{ github.event.inputs.quality }}
            **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          files: downloads/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
