# .github/workflows/download.yml
name: 🎬 YouTube Downloader - Final Pro Version

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 YouTube video URL'
        required: true
        type: string
        default: 'https://youtu.be/dQw4w9WgXcQ'
      quality:
        description: '🎬 Select quality (subtitles will be embedded)'
        required: true
        type: choice
        options:
          - 'best (original quality, may be large)'
          - '2160p (4K)'
          - '1440p (2K)'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'

permissions:
  contents: write

jobs:
  download-and-embed-subs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # مرحله 1: دریافت کدهای مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # مرحله 2: نصب ابزارهای مورد نیاز با قابلیت EJS (حل مشکل n-sig یوتیوب)
      - name: Setup yt-dlp with full features
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true      # حل چالش جاوااسکریپت یوتیوب
          aria2: true         # دانلود چندبخشی برای سرعت بالا
          ffmpeg: true        # ضروری برای ادغام ویدیو، صدا و زیرنویس

      # مرحله 3: ایجاد فایل کوکی (در صورت وجود Secret)
      - name: Create cookies file (to avoid bot detection)
        env:
          COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
            echo "✅ Cookies loaded"
          else
            echo "⚠️ No cookies – may encounter bot error for some videos"
          fi

      # مرحله 4: تعیین فرمت بر اساس کیفیت انتخابی (با اولویت H.264 برای سازگاری بیشتر)
      - name: Determine yt-dlp format
        id: set_format
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          case "$QUALITY" in
            "best (original quality, may be large)")
              FORMAT="bestvideo+bestaudio/best"
              ;;
            "2160p (4K)")
              FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]"
              ;;
            "1440p (2K)")
              FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]"
              ;;
            "1080p")
              FORMAT="bestvideo[height<=1080][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=1080]"
              ;;
            "720p")
              FORMAT="bestvideo[height<=720][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=720]"
              ;;
            "480p")
              FORMAT="bestvideo[height<=480][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=480]"
              ;;
            "360p")
              FORMAT="bestvideo[height<=360][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=360]"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/best"
              ;;
          esac
          echo "FORMAT=$FORMAT" >> $GITHUB_ENV
          echo "✅ Format set: $FORMAT"

      # مرحله 5: دانلود ویدیو و جاسازی زیرنویس‌های فارسی و انگلیسی در قالب MKV
      - name: Download video with Persian & English subtitles (embedded)
        run: |
          mkdir -p videos
          DOWNLOAD_CMD="yt-dlp -f '${{ env.FORMAT }}' \
            --merge-output-format mkv \
            --downloader aria2c \
            --downloader-args 'aria2c:-x 16 -s 16 -k 1M' \
            --write-subs \
            --write-auto-subs \
            --sub-langs "fa,en" \
            --sub-format "srt/best" \
            --embed-subs \
            --convert-subs srt \
            --embed-thumbnail \
            --add-metadata \
            -o 'videos/%(title)s.%(ext)s' \
            '${{ github.event.inputs.video_url }}'"
          [ -f cookies.txt ] && DOWNLOAD_CMD="$DOWNLOAD_CMD --cookies cookies.txt"
          
          echo "🚀 Starting download with subtitle embedding..."
          eval $DOWNLOAD_CMD
          
          # بررسی وجود فایل خروجی
          if [ -z "$(ls videos/*.mkv 2>/dev/null)" ]; then
            echo "❌ No MKV file created. Download failed."
            exit 1
          fi
          echo "✅ Successfully downloaded and embedded subtitles"

      # مرحله 6: commit و push به مخزن (بدون پارتیشن‌بندی برای حفظ سادگی و کیفیت)
      - name: Commit and push final video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git commit -m "🎥 Add video with embedded Persian & English subs from ${{ github.event.inputs.video_url }}" || echo "No changes to commit"
          git push
