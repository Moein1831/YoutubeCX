# .github/workflows/download.yml
name: YouTube Downloader (Save to Repo)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک ویدیو یوتیوب'
        required: true
        type: string
        default: 'https://youtu.be/dQw4w9WgXcQ'
      quality:
        description: '🎬 کیفیت مورد نظر'
        required: true
        type: choice
        options:
          - 'best (بالاترین کیفیت)'
          - '1080p (Full HD)'
          - '720p (HD)'
          - '480p'
          - '360p'

# اجازه دسترسی به مخزن برای push
permissions:
  contents: write

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1️⃣ دریافت کدهای مخزن
        uses: actions/checkout@v4

      - name: 2️⃣ نصب yt-dlp با قابلیت EJS و aria2 و ffmpeg
        uses: AnimMouse/setup-yt-dlp@v3
        with:
          ejs-node: true   # حل مشکل n-sig یوتیوب
          aria2: true      # دانلود چندبخشی سریع
          ffmpeg: true     # ادغام ویدیو و صدا

      - name: 3️⃣ ایجاد فایل کوکی (در صورت وجود secret)
        env:
          COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$COOKIES_SECRET" ]; then
            echo "$COOKIES_SECRET" > cookies.txt
            echo "✅ کوکی با موفقیت ایجاد شد"
          else
            echo "⚠️ کوکی یافت نشد (در صورت بروز خطا، secret را اضافه کنید)"
          fi

      - name: 4️⃣ تعیین فرمت بر اساس کیفیت انتخابی
        id: set_format
        run: |
          QUALITY="${{ github.event.inputs.quality }}"
          case "$QUALITY" in
            "best (بالاترین کیفیت)")
              FORMAT="bestvideo+bestaudio/best"
              ;;
            "1080p (Full HD)")
              FORMAT="bestvideo[height<=1080][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=1080][ext=mp4]"
              ;;
            "720p (HD)")
              FORMAT="bestvideo[height<=720][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]"
              ;;
            "480p")
              FORMAT="bestvideo[height<=480][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=480][ext=mp4]"
              ;;
            "360p")
              FORMAT="bestvideo[height<=360][ext=mp4][vcodec^=avc1]+bestaudio[ext=m4a]/best[height<=360][ext=mp4]"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/best"
              ;;
          esac
          echo "FORMAT=$FORMAT" >> $GITHUB_ENV
          echo "✅ فرمت انتخاب شد: $FORMAT"

      - name: 5️⃣ دانلود ویدیو از یوتیوب
        run: |
          mkdir -p videos
          DOWNLOAD_CMD="yt-dlp -f '${{ env.FORMAT }}' \
            --merge-output-format mp4 \
            --downloader aria2c \
            --downloader-args 'aria2c:-x 16 -s 16 -k 1M' \
            -o 'videos/%(title)s.%(ext)s' \
            '${{ github.event.inputs.video_url }}'"
          
          if [ -f cookies.txt ]; then
            DOWNLOAD_CMD="$DOWNLOAD_CMD --cookies cookies.txt"
          fi
          
          echo "در حال اجرا: $DOWNLOAD_CMD"
          eval $DOWNLOAD_CMD
          
          # بررسی اینکه فایلی دانلود شده است
          if [ -z "$(ls -A videos 2>/dev/null)" ]; then
            echo "❌ خطا: هیچ فایلی دانلود نشد. کیفیت دیگری را امتحان کنید یا کوکی اضافه کنید."
            exit 1
          fi
          
          echo "✅ دانلود با موفقیت انجام شد"
          echo "VIDEO_FILE=$(ls videos/*.mp4 | head -1)" >> $GITHUB_ENV

      - name: 6️⃣ ذخیره ویدیو در مخزن (commit & push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git commit -m "Add video from ${{ github.event.inputs.video_url }}" || echo "هیچ تغییری برای commit وجود ندارد"
          git push
